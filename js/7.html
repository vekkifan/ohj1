<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>7</title>
</head>
<body>
  <div id="target"></div>

  <script>
    'use strict';

    const diceCount = parseInt(prompt('How many dice would you like to roll?'), 10);
    let totalSum = 0;

    for (let i = 0; i < diceCount; i++) {
      const roll = Math.floor(Math.random() * 6) + 1;
      totalSum += roll;
    }

    document.querySelector('#target').innerHTML = `The sum of rolling ${diceCount} dice is ${totalSum}.`;
  </script>
</body>
</html>
