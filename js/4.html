<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>4</title>
</head>
<body>
  <div id="target"></div>

  <script>
    'use strict';

    const studentName = prompt("Enter the student's name:");
    const houseNumber = Math.floor(Math.random() * 4) + 1;
    let house;

    switch (houseNumber) {
      case 1:
        house = 'Gryffindor';
        break;
      case 2:
        house = 'Slytherin';
        break;
      case 3:
        house = 'Hufflepuff';
        break;
      case 4:
        house = 'Ravenclaw';
        break;
    }

    document.querySelector('#target').innerHTML = `${studentName}, you are ${house}.`;
  </script>
</body>
</html>
