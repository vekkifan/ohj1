<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>9</title>
</head>
<body>
  <div id="target"></div>

  <script>
    'use strict';

    const number = parseInt(prompt('Enter an integer:'), 10);
    let isPrime = true;

    if (number <= 1) {
      isPrime = false;
    } else {
      for (let i = 2; i <= Math.sqrt(number); i++) {
        if (number % i === 0) {
          isPrime = false;
          break;
        }
      }
    }

    if (isPrime) {
      document.querySelector('#target').innerHTML = `${number} is a prime number.`;
    } else {
      document.querySelector('#target').innerHTML = `${number} is not a prime number.`;
    }
  </script>
</body>
</html>
