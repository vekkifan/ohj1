<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>6</title>
</head>
<body>
  <div id="target"></div>

  <script>
    'use strict';

    const shouldCalculate = confirm('Should I calculate the square root?');
    const target = document.querySelector('#target');

    if (shouldCalculate) {
      const number = parseFloat(prompt('Enter a number:'));
      if (number < 0) {
        target.innerHTML = 'The square root of a negative number is not defined.';
      } else {
        const sqrt = Math.sqrt(number);
        target.innerHTML = `The square root of ${number} is ${sqrt}.`;
      }
    } else {
      target.innerHTML = 'The square root is not calculated.';
    }
  </script>
</body>
</html>
