<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>5</title>
</head>
<body>
  <section id="pictures"></section>

  <script>
    'use strict';

    const picArray = [
      {
        title: 'Title 1',
        caption: 'Caption 1',
        description: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis sodales enim eget leo condimentum vulputate.',
        image: {
          large: 'img/pic1.jpg',
          medium: 'thumbnails/pic1.jpg',
        },
      },
      {
        title: 'Title 2',
        caption: 'Caption 2',
        description: 'Sed convallis consectetur fermentum. Vestibulum at velit non velit gravida vehicula.',
        image: {
          large: 'img/pic2.jpg',
          medium: 'thumbnails/pic2.jpg',
        },
      },
      {
        title: 'Title 3',
        caption: 'Caption 3',
        description: 'Phasellus imperdiet nunc tincidunt molestie vestibulum. Donec dictum suscipit nibh.',
        image: {
          large: 'img/pic3.jpg',
          medium: 'thumbnails/pic3.jpg',
        },
      },
    ];

    const section = document.querySelector('#pictures');

    for (const pic of picArray) {
      const article = document.createElement('article');
      article.classList.add('card');

      const h2 = document.createElement('h2');
      h2.textContent = pic.title;

      const figure = document.createElement('figure');

      const img = document.createElement('img');
      img.src = pic.image.medium;
      img.alt = pic.title;

      const figcaption = document.createElement('figcaption');
      figcaption.textContent = pic.caption;

      figure.appendChild(img);
      figure.appendChild(figcaption);

      const p = document.createElement('p');
      p.textContent = pic.description;

      article.appendChild(h2);
      article.appendChild(figure);
      article.appendChild(p);

      section.appendChild(article);
    }
  </script>
</body>
</html>
