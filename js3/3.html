<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>3</title>
</head>
<body>
  <ul id="target"></ul>

  <script>
    'use strict';

    const names = ['John', 'Paul', 'Jones'];
    const target = document.querySelector('#target');
    let html = '';

    for (let i = 0; i < names.length; i++) {
      html += `<li>${names[i]}</li>`;
    }

    target.innerHTML = html;
  </script>
</body>
</html>
