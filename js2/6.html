<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>6</title>
</head>
<body>
  <div id="target"></div>

  <script>
    'use strict';

    function rollDice() {
      return Math.floor(Math.random() * 6) + 1;
    }

    let html = '<ul>';
    let roll = 0;

    while (roll !== 6) {
      roll = rollDice();
      html += `<li>${roll}</li>`;
    }

    html += '</ul>';
    document.querySelector('#target').innerHTML = html;
  </script>
</body>
</html>
